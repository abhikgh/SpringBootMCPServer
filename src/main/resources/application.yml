spring:
  application:
    name: SpringBootMCPServer #"@project.name@"
  datasource:
    url: jdbc:postgresql://localhost:5432/springbootdb
    username: postgres
    password: tiger
    #password: ENC(a28+rzKYU3zwbY4gWs/26Jm5wGq3dh+dYBsoGSADjJCzdYGEMS7+tUtpoANzHwnZ)
    hikari:
      connection-timeout: 5000
      maximum-pool-size: 5
      idle-timeout: 600000
  jpa:
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  ai:
    mcp:
      server:
        protocol: STREAMABLE
        name: customer-mcp-server
        version: 1.0.0
        type: SYNC
        capabilities:
          tool: true
          resource: false
          prompt: false
        streamable-http:
          mcp-endpoint: /mcp

server:
  port: 8093

#run a springboot appliccation with mcp server connecting to postgresql
  # Spring AI MCP Configuration
  ai:
    mcp:
      server:
        stdio:
          enabled: true
        name: "PostgreSQL Data Tool"
        version: "1.0.0"

# Crucial for Stdio transport: ensure logs go to a file, NOT stdout
logging:
  file:
    name: logs/mcp-server.log
  level:
    root: INFO

